name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the project, dev and evals groups, from the lockfile
        run: uv sync --all-groups --frozen

      - name: Lint
        run: uv run ruff check src evals tests

      - name: Format check
        run: uv run ruff format --check src evals tests

      - name: Type check
        run: uv run mypy src

      - name: Regenerate the synthetic set and confirm it is byte-identical to the commit
        run: |
          uv run python -m evals.synth.build --out data/synthetic --seed 2026
          git diff --stat --exit-code -- data/synthetic

      - name: Tests (offline; model calls are replayed from fixtures)
        run: uv run pytest -q
