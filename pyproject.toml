[project]
name = "docintel"
version = "0.1.0"
description = "Document intelligence pipeline for supplier quotations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.7",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith>=0.14.4",
    "markitdown[docx,pptx,xlsx]>=0.1.8",
    "onnxruntime>=1.30.0",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pydantic>=2.11",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "python-docx>=1.2.0",
    "rapidocr>=3.9.2",
]

[project.optional-dependencies]
# One provider per extra. The model is a provider:model string; install the matching extra.
openai = ["langchain-openai>=1.0"]
google = ["langchain-google-genai>=3.0"]
aws = ["langchain-aws>=1.0"]
ollama = ["langchain-ollama>=1.0"]

[project.scripts]
docintel = "docintel.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "types-openpyxl>=3.1.5.20260827",
    "playwright>=1.63.0",
]
evals = [
    "reportlab",
    "pymupdf",
    "pillow",
    "numpy",
    "openpyxl",
    "python-docx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docintel"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "evals", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Document templates and prose literals read better unwrapped.
"evals/synth/*.py" = ["E501"]
# Report rows and SQL DDL are templates; wrapping them hides their shape.
"src/docintel/store/writer.py" = ["E501"]
"evals/score.py" = ["E501"]
# Embedded CSS and JS for the self-contained review page.
"src/docintel/store/review_html.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["pymupdf4llm", "pymupdf4llm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF ships partial annotations; its page and pixmap methods are untyped.
module = ["docintel.ingest.pdf_loader"]
disallow_untyped_calls = false
