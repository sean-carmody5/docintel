[project]
name = "docintel"
version = "0.1.0"
description = "Document intelligence pipeline for supplier quotations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "onnxruntime>=1.30.0",
    "pydantic>=2.11",
    "rapidocr>=3.9.2",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
]
evals = [
    "reportlab",
    "pymupdf",
    "pillow",
    "numpy",
    "openpyxl",
    "python-docx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docintel"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "evals", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Document templates and prose literals read better unwrapped.
"evals/synth/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
